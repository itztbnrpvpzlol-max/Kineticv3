name: build-apk
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  apk:
    # ubuntu-latest moved to Ubuntu 26 in late 2026; pin a supported LTS
    # image so Android SDK setup remains compatible and reproducible.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kinetic-apk
          path: app/build/outputs/apk/release/*.apk
